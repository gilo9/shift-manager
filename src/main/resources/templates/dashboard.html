<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Manager — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
    <script th:inline="javascript">
        const username = [[${username}]];
        console.log("Logged in as: " + username);
    </script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f0ede8;
            color: #1a1916;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #1a1916;
            color: #f0ede8;
            padding: 0 2rem;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #9e9890;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .username-badge {
            font-size: 13px;
            color: #c8c4bc;
        }

        .username-badge span {
            color: #f0ede8;
            font-weight: 500;
        }

        .logout-link {
            font-size: 13px;
            color: #9e9890;
            text-decoration: none;
            border-left: 1px solid #333028;
            padding-left: 1.25rem;
            transition: color 0.15s;
        }
        .logout-link:hover { color: #f0ede8; }

        /* Main layout */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-header {
            margin-bottom: 1.75rem;
        }

        .page-header h1 {
            font-size: 22px;
            font-weight: 500;
            color: #1a1916;
        }

        .page-header p {
            font-size: 14px;
            color: #9e9890;
            margin-top: 4px;
        }

        /* Table card */
        .table-card {
            background: #ffffff;
            border: 1px solid #e2ddd8;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: #faf9f7;
            border-bottom: 1px solid #e2ddd8;
        }

        thead th {
            padding: 12px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 500;
            font-family: 'DM Mono', monospace;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #9e9890;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid #f0ede8;
            transition: background 0.1s;
        }

        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #faf9f7; }

        tbody td {
            padding: 14px 16px;
            color: #3a3834;
            vertical-align: middle;
        }

        /* Empty state */
        .empty-state {
            padding: 3rem 1rem;
            text-align: center;
        }

        .empty-state p {
            font-size: 14px;
            color: #9e9890;
        }
    </style>
</head>
<body>

    <header>
        <span class="brand">Shift Manager</span>
        <div class="header-right">
            <span class="username-badge">Signed in as <span th:text="${username}">user</span></span>
            <a class="logout-link" th:href="@{/login?logout=true}">Sign out</a>
        </div>
    </header>

    <main>
        <div class="page-header">
            <h1>My shifts</h1>
            <p th:text="${username} + '\'s upcoming and recent shifts'">Your upcoming and recent shifts</p>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Shift</th>
                        <th>Location</th>
                        <th>Date</th>
                        <th>Hours</th>
                        <th>Rate</th>
                        <th>Total pay</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Thymeleaf loop goes here once shifts are wired up -->
                    <!-- th:each="shift : ${shifts}" -->
                    <tr th:if="${shifts == null or shifts.empty}">
                        <td colspan="6">
                            <div class="empty-state">
                                <p>No shifts to display yet.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
